schema_version: 1

context:
  version: "3.1.1"

package:
  name: marshmallow-oneofschema
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/marshmallow-oneofschema/marshmallow_oneofschema-${{ version }}.tar.gz
  sha256: 68b4a57d0281a04ac25d4eb7a4c5865a57090a0a8fd30fd6362c8e833ac6a6d9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core <4
    - pip
  run:
    - python >=${{ python_min }}
    - marshmallow >=3.0.0,<4.0.0

tests:
  - python:
      imports:
        - marshmallow_oneofschema
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Marshmallow library extension that allows schema (de)multiplexing
  homepage: https://github.com/marshmallow-code/marshmallow-oneofschema

extra:
  recipe-maintainers:
    - dhirschfeld
    - rzillman
