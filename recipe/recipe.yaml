schema_version: 1

context:
  version: "3.2.0"

package:
  name: marshmallow-oneofschema
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/marshmallow-oneofschema/marshmallow_oneofschema-${{ version }}.tar.gz
  sha256: c06c8d9f14d51ffff152d66d85bd5f27d55cff10752a3b1f8c1f948bf5f597a0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core <4
    - pip
  run:
    - python >=${{ python_min }}
    - marshmallow >=3.0.0,<5.0.0

tests:
  - python:
      imports:
        - marshmallow_oneofschema
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Marshmallow library extension that allows schema (de)multiplexing
  homepage: https://github.com/marshmallow-code/marshmallow-oneofschema

extra:
  recipe-maintainers:
    - dhirschfeld
    - mgorny
    - rzillman
